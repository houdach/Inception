version: "3.8"

services:
  nginx:
    build: ./requirements/nginx
    networks:
      - inception_network
    volumes:
      - wordpress_files:/var/www/html
    restart: always

  wordpress:
    build: ./requirements/wordpress
    networks:
      - inception_network
    volumes:
      - wordpress_files:/var/www/html
    depends_on:
      - mariadb
    restart: always

  mariadb:
    build: ./requirements/mariadb
    networks:
      - inception_network
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    restart: always

networks:
  inception_network:
    driver: bridge

volumes:
  mariadb_data:
  wordpress_files:
